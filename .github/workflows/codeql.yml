name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday

# Fork pull requests stay on GitHub-hosted: this repository is public and
# RunsOn runners sit in the infra-prod network (same rule as ci.yml).
jobs:
  analyze:
    name: Analyze
    runs-on: >-
      ${{ (contains(fromJSON('["push","schedule"]'), github.event_name)
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
      && fromJSON(format('["runs-on={0}","cpu=2","ram=4+8","family=m8a.*+m8i.*+m7a.*+m7i.*+c8a.*+c8i.*+c7a.*+c7i.*","image=ubuntu24-full-x64","spot=price-capacity-optimized","env=infra-prod-blue"]', github.run_id))
      || 'ubuntu-latest' }}
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
